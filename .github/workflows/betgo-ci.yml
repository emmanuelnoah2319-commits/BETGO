
name: Apply BETGO ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract BETGO ZIP
        run: |
          set -euo pipefail
          mkdir -p /tmp/betgo-extracted
          unzip -q BETGO-phase4-integration-test-guard.zip -d /tmp/betgo-extracted

          echo "Files inside ZIP:"
          find /tmp/betgo-extracted -maxdepth 3 -type f | head -100

          PACKAGE="$(find /tmp/betgo-extracted -name package.json -type f -print -quit)"
          test -n "$PACKAGE" || {
            echo "ERROR: No package.json found in ZIP"
            exit 1
          }

          echo "PROJECT_DIR=$(dirname "$PACKAGE")" >> "$GITHUB_ENV"

      - name: Apply project files
        run: |
          set -euo pipefail

          SOURCE="$PROJECT_DIR"

          # Copy files, but preserve GitHub workflows and repository metadata.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='BETGO-phase4-integration-test-guard.zip' \
            "$SOURCE/" ./

          git status --short

      - name: Commit applied files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- .
          if git diff --cached --quiet; then
            echo "No changes to apply."
            exit 0
          fi

          git commit -m "Apply BETGO ZIP project files"
          git push
